[project]
name = "base"
version = "0.1.0"
description = "Plantilla base para proyectos web con Django."
# pip no lo verifica al instalar grupos de dependencias; lo leen otras herramientas.
requires-python = ">=3.14,<3.15"

# Dependencias directas, con rangos de versión. Las versiones exactas, incluidas las
# transitivas, se generan en requirements.txt y requirements-dev.txt con
# scripts/fijar_versiones.py.
[dependency-groups]
prod = [
    "django>=6.1.2,<6.2",
    "psycopg[binary]>=3.3.6,<3.4",
    "python-dotenv>=1.2.4,<2",
    "django-allauth[mfa]>=65.19.7,<66",
    # Se declaran explícitamente porque otras dependencias solo las exigen en Windows
    # (Django y psycopg a tzdata, qrcode a colorama), y el resultado de fijar_versiones.py
    # debe ser el mismo en todos los sistemas.
    "tzdata>=2026.5",
    "colorama>=0.4.6",
]
dev = [
    {include-group = "prod"},
]
